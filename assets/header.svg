<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs>
<pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#2A241F" stroke-width="1" opacity=".55"/></pattern>
<radialGradient id="glow" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#C8A97E" stop-opacity=".16"/><stop offset="1" stop-color="#C8A97E" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#C8A97E"/><stop offset="1" stop-color="#C8A97E" stop-opacity="0"/></linearGradient>
</defs>
<style>
.a{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ln{transform-origin:0 0;transform:scaleX(0);animation:ln 1.4s cubic-bezier(.2,.7,.2,1) .3s forwards}
@keyframes ln{to{transform:scaleX(1)}}
.cur{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
</style>
<rect width="900" height="240" rx="14" fill="#14110F"/>
<rect width="900" height="240" rx="14" fill="url(#g)"/>
<rect width="900" height="240" rx="14" fill="url(#glow)"/>
<rect x=".5" y=".5" width="899" height="239" rx="14" fill="none" stroke="#2A241F"/>
<text class="a" x="64" y="70" font-family="SF Mono,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="3" fill="#C8A97E">~ / PROFILE</text>
<text class="a d1" x="62" y="134" font-family="-apple-system,'Helvetica Neue',Inter,'Segoe UI',Arial,sans-serif" font-size="52" font-weight="200" letter-spacing="1" fill="#EDE6DA">uaamagician<tspan class="cur" fill="#C8A97E">_</tspan></text>
<g class="a d2"><rect class="ln" x="64" y="158" width="260" height="1.5" fill="url(#fade)"/></g>
<text class="a d3" x="64" y="190" font-family="SF Mono,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1" fill="#8C8175">JavaScript  /  Dart  /  C++  /  Verilog</text>
